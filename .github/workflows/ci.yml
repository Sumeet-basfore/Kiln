name: CI

on:
  push:
    branches: ["main", "master", "t**"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: dtolnay/rust-toolchain@a54c7dd93677772b5476144275926910ea04b507 # stable
        with:
          components: rustfmt
      - name: Check formatting
        shell: bash
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: dtolnay/rust-toolchain@a54c7dd93677772b5476144275926910ea04b507 # stable
        with:
          components: clippy
      - name: Run clippy
        shell: bash
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: dtolnay/rust-toolchain@a54c7dd93677772b5476144275926910ea04b507 # stable
      - name: Run tests
        shell: bash
        run: cargo test --workspace

  bench-check:
    name: Benchmark Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: dtolnay/rust-toolchain@a54c7dd93677772b5476144275926910ea04b507 # stable
      - name: Check benchmarks compile
        shell: bash
        run: cargo bench --no-run

  dependency-direction:
    name: Dependency Direction Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - name: Run check-deps script
        shell: bash
        run: bash scripts/check-deps.sh

  cargo-deny:
    name: Cargo Deny (Security & Licenses)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.2.1
      - uses: EmbarkStudios/cargo-deny-action@3f4a782664881cfac704d1bad03c0ea780158c50 # v2.0.9
