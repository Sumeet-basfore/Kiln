# cargo-deny configuration for Kiln
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
unsound = "warn"
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
# The project license is undecided (D5).
# Ignore private workspace crates (publish = false) so workspace development is unblocked.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "LicenseRef-Undecided",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
