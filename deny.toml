# cargo-deny configuration for Kiln
# See https://embarkstudios.github.io/cargo-deny/

[advisories]
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
]

[licenses.private]
# Ignore workspace crates that aren't published (publish = false)
# because the project license is undecided (decision D5).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
allow-workspace = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
